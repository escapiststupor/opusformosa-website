<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 Opus 音樂節 - Opus Formosa</title>
  <meta name="description" content="2027 年 8 月 14 日台中、8 月 17 日台北。" />
  <meta property="og:title" content="2027 Opus 音樂節" />
  <meta property="og:description" content="2027 年 8 月 14 日台中、8 月 17 日台北。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://opusformosa.org/festival2027.html" />
  <link rel="canonical" href="https://opusformosa.org/festival2027.html" />
  <link rel="alternate" hreflang="zh-TW" href="https://opusformosa.org/festival2027.html" />
  <link rel="alternate" hreflang="en" href="https://opusformosa.org/en/festival2027.html" />
  <link rel="alternate" hreflang="x-default" href="https://opusformosa.org/festival2027.html" />
  <link rel="icon" href="assets/opus_formosa_logo.png" type="image/png" />
  <link rel="stylesheet" href="assets/nav-mobile.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {theme:{extend:{
      colors:{ink:'#0d0b09',cream:'#f0e8d8',gold:'#c89840',classical:{gold:'#c89840',dark:'#0d0b09'}},
      fontFamily:{display:['"Cormorant Garamond"','Georgia','serif'],body:['"Crimson Pro"','Georgia','serif']}
    }}};
  </script>
  <script src="assets/nav-bar.js" defer></script>
  <script src="assets/nav-toggle.js" defer></script>
  <style>
    body { margin:0; background:#0d0b09; color:#f0e8d8; }
    .festival-header { padding:80px 24px 56px; text-align:center; border-bottom:1px solid rgba(200,152,64,.22); }
    .festival-header img { width:160px; height:auto; margin:0 auto 32px; }
    .festival-header h1 { font-size:2.5rem; line-height:1.2; font-weight:400; }
    .festival-dates { max-width:960px; margin:0 auto; padding:32px 24px 80px; }
    .festival-date { display:grid; grid-template-columns:220px 1fr; gap:32px; padding:36px 0; border-bottom:1px solid rgba(200,152,64,.22); }
    .festival-date time { color:#c89840; font-size:1.5rem; }
    .festival-date h2 { font-size:1.5rem; font-weight:600; line-height:1.5; margin:0; }
    .festival-date p { font-size:1.1rem; color:#c5bbae; margin:8px 0 0; }
    footer { border-top:1px solid rgba(200,152,64,.22); padding:32px 24px; text-align:center; color:#c5bbae; }
    @media(max-width:640px) {
      .festival-header { padding:56px 24px 40px; }
      .festival-header h1 { font-size:2rem; }
      .festival-date { grid-template-columns:1fr; gap:12px; }
    }
  </style>
</head>
<body class="font-body">
  <nav-bar lang="zh"></nav-bar>
  <header class="festival-header">
    <img src="assets/opus_formosa_logo_white.png" alt="Opus Formosa" width="400" height="226" />
    <h1 class="font-display">2027 Opus 音樂節</h1>
  </header>
  <main class="festival-dates">
    <article class="festival-date">
      <time datetime="2027-08-14">2027 / 08 / 14<br /><span class="text-base">星期六</span></time>
      <div>
        <h2 class="font-display">臺中國家歌劇院大劇院</h2>
        <p>台中</p>
      </div>
    </article>
    <article class="festival-date">
      <time datetime="2027-08-17">2027 / 08 / 17<br /><span class="text-base">星期二</span></time>
      <div>
        <h2 class="font-display">國家音樂廳</h2>
        <p>台北</p>
      </div>
    </article>
  </main>
  <footer><p>Opus Formosa · 福爾摩沙藝響</p></footer>
</body>
</html>
