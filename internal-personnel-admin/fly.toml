app = 'opus-personnel'
primary_region = 'nrt'

[env]
  APP_AUTH_MODE = 'google'
  BASE_URL = 'https://personnel.opusformosa.org'
  DATABASE_PATH = '/data/personnel.db'
  DOCUMENT_STORAGE_PATH = '/data/personnel-documents'

[mounts]
  source = 'personnel_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
