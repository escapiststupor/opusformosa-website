{% extends 'base.html' %}
{% block title %}新增核銷單{% endblock %}
{% block content %}
<form class="form-card compact-form" method="post" action="{{ admin_base }}/reimbursements/create">
  <div class="form-top"><div><div class="eyebrow">Reimbursement</div><h1>新增核銷單</h1><p class="form-lead">核銷只會加到月底實際匯款金額，不會計入勞報所得、扣繳或二代健保。</p></div><button class="button">新增核銷單</button></div>
  <section class="form-section"><div class="grid">
    <label class="field full"><span>申請人 *</span><select required name="person_id"><option value="">請選擇人員</option>{% for person in people %}<option value="{{ person.id }}">{{ person.legal_name_zh or person.display_name }}{% if person.legal_name_en %} ／{{ person.legal_name_en }}{% endif %}</option>{% endfor %}</select></label>
    <label class="field"><span>付款月份 *</span><input required type="month" name="payment_month" value="{{ payment_month }}"></label>
    <label class="field"><span>核銷總額（NT$） *</span><input required name="amount" inputmode="numeric" pattern="[0-9]+" placeholder="例如 3500"></label>
    <label class="field full"><span>備註（選填）</span><textarea name="notes"></textarea></label>
  </div></section>
  <footer class="form-footer"><a class="back" href="{{ admin_base }}/payments?month={{ payment_month }}">← 回付款總覽</a><button class="button">新增核銷單</button></footer>
</form>
{% endblock %}
