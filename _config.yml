# Jekyll 設定
# Internal tooling lives in the private opusformosa-internal-tools repo.
# This public site should publish only generated/static-safe artifacts.
exclude:
  - internal-seatmap-admin/
  - internal-personnel-admin/
  - seatmap/_dev/
  - tmp/
  - output/
  - deploy.sh
  - "**/*.py"
  - "**/*.xlsx"
  - "**/*.db"
  - "**/*.sqlite"
  - "**/*.sqlite3"
  - "**/__pycache__/"
  - "**/node_modules/"
  - "**/.venv/"
