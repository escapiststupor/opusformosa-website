name: Sync OPENTIX seat maps

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sync-opentix-seatmaps.yml"
      - "seatmap/_dev/**"
      - "internal-seatmap-admin/**"
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opentix-seatmap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      OPENTIX_ADMIN_USERNAME: ${{ secrets.OPENTIX_ADMIN_USERNAME }}
      OPENTIX_ADMIN_PASSWORD: ${{ secrets.OPENTIX_ADMIN_PASSWORD }}
      OPENTIX_COGNITO_REFRESH_TOKEN: ${{ secrets.OPENTIX_COGNITO_REFRESH_TOKEN }}
      SEATMAP_ADMIN_SYNC_TOKEN: ${{ secrets.SEATMAP_ADMIN_SYNC_TOKEN }}
      SEATMAP_ADMIN_SYNC_URL: https://api.opusformosa.org
      NODE_PATH: /tmp/opentix-sync-node/node_modules
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          mkdir -p /tmp/opentix-sync-node
          cd /tmp/opentix-sync-node
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Sync seat maps
        run: |
          set +e
          python3 seatmap/_dev/sync-opentix-seatmaps.py 2>&1 | tee /tmp/opentix-admin-sync.log
          sync_status=${PIPESTATUS[0]}
          set -e

          if [ "$sync_status" -ne 0 ]; then
            if grep -Eqi 'OPENTIX headless login failed|refresh token failed|NotAuthorizedException|HTTP (401|403|5[0-9][0-9])|升級維護|服務暫停' /tmp/opentix-admin-sync.log; then
              echo "::warning::Full OPENTIX admin sync failed because OPENTIX auth/admin is unavailable. Falling back to existing snapshots with public availability refresh."
              python3 seatmap/_dev/sync-opentix-seatmaps.py --from-existing-snapshot --refresh-public-status || \
                python3 seatmap/_dev/sync-opentix-seatmaps.py --from-existing-snapshot
            else
              exit "$sync_status"
            fi
          fi

      - name: Push snapshots to internal admin DB
        if: ${{ env.SEATMAP_ADMIN_SYNC_TOKEN != '' }}
        run: |
          python3 seatmap/_dev/push-seatmaps-to-admin.py \
            --api-base "$SEATMAP_ADMIN_SYNC_URL" \
            --token "$SEATMAP_ADMIN_SYNC_TOKEN" \
            --commit-sha "$GITHUB_SHA"

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/opentix seatmap/opentix
          if git diff --cached --quiet; then
            echo "No OPENTIX seat-map changes."
            exit 0
          fi
          git commit -m "Update OPENTIX seat map snapshots"
          git push
