name: Sync OPENTIX seat maps

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sync-opentix-seatmaps.yml"
      - "seatmap/_dev/**"
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opentix-seatmap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      OPENTIX_ADMIN_USERNAME: ${{ secrets.OPENTIX_ADMIN_USERNAME }}
      OPENTIX_ADMIN_PASSWORD: ${{ secrets.OPENTIX_ADMIN_PASSWORD }}
      OPENTIX_COGNITO_REFRESH_TOKEN: ${{ secrets.OPENTIX_COGNITO_REFRESH_TOKEN }}
      NODE_PATH: /tmp/opentix-sync-node/node_modules
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          mkdir -p /tmp/opentix-sync-node
          cd /tmp/opentix-sync-node
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Sync seat maps
        run: python3 seatmap/_dev/sync-opentix-seatmaps.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/opentix seatmap/opentix
          if git diff --cached --quiet; then
            echo "No OPENTIX seat-map changes."
            exit 0
          fi
          git commit -m "Update OPENTIX seat map snapshots"
          git push
