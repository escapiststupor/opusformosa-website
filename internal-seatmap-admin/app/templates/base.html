<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Opus Seatmap Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/admin">Opus Seatmap Admin</a>
      <div class="session">
        <span>{{ admin_email }}</span>
        {% if auth_mode() == "google" %}
        <form action="/auth/logout" method="post">
          <button type="submit" class="session-logout">登出</button>
        </form>
        {% endif %}
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
