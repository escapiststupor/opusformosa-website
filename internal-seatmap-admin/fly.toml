# fly.toml app configuration file generated for opus-seatmap-admin on 2026-08-10T23:46:11+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'opus-seatmap-admin'
primary_region = 'nrt'

[build]

[env]
  ADMIN_AUTH_MODE = 'google'
  BASE_URL = 'https://api.opusformosa.org'
  CORS_ORIGINS = 'https://opusformosa.org,https://www.opusformosa.org'
  DATABASE_PATH = '/data/seatmap.db'
  OPENTIX_ASSETS_DIR = '/data/opentix'

[mounts]
  source = 'seatmap_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
